# 数据云端协同优化传输平台 · electron-builder 打包配置
#
# 项目不引入 electron / electron-builder 依赖，统一通过 npx 临时调用。
# 统一入口：node scripts/pack-win.mjs（或 Windows 下双击 pack-win.bat）
#
# 注意：不要用 `-c.electronVersion=xxx` / `-c.directories.output=xxx` 这类短别名
# 覆盖。PowerShell 下 yargs 会把它们当成 `--config` 的又一个配置文件路径，
# 报 ENOENT: open '...\.directories.output=release'。脚本改为生成
# electron-builder.generated.yml（extends 本文件）来传参。

appId: com.duoduo.cloudflow
productName: 数据云端协同优化传输平台
copyright: Copyright © 2026 duoduo-sxx

directories:
  # 默认输出目录，可被 -c.directories.output 覆盖
  output: release
  # 应用图标等资源目录（build/icon.ico / build/icon.png）
  buildResources: build

files:
  - dist/**/*
  - electron/**/*
  - package.json
  - "!**/*.map"

# 渲染层是纯静态前端，无任何 Node 依赖，直接打进 asar
asar: true
compression: normal
# 无原生模块，跳过 npm rebuild 以加快打包
npmRebuild: false

win:
  icon: build/icon.ico
  target:
    - target: portable
      arch: [x64]

portable:
  # 产物文件名使用 ASCII，避免跨机器路径编码问题
  artifactName: CloudFlow-Portable-${version}-${arch}.${ext}
  requestExecutionLevel: user
