# 星火链证 XH-CHAIN · electron-builder 打包配置
# 用法（Windows）：
#   set ELECTRON_VERSION=<版本>
#   npx --yes electron-builder@latest --win portable --x64 ^
#     --config electron-builder.yml -c.electronVersion=%ELECTRON_VERSION% ^
#     -c.directories.output=release-retry-xxxx
# 注意：项目不引入 electron 依赖，运行时版本一律通过 -c.electronVersion 传入。

appId: cn.xhchain.desktop
# productName 保持 ASCII：中文会写进 NSIS 脚本与 exe 版本资源，在 CI 代码页下易出错。
# 窗口标题等界面文案由 electron/main.cjs 中的中文 title 控制，用户看到的仍是「星火链证 XH-CHAIN」。
productName: XH-CHAIN
copyright: Copyright © 2026 XH-CHAIN

directories:
  buildResources: build
  output: release

# 前端已由 vite 全量打包为静态资源，运行时不需要任何 node_modules
files:
  - dist/**/*
  - electron/**/*
  - build/icon.png
  - package.json
  - '!node_modules/**/*'
  - '!**/*.map'

asar: false
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false

publish: null

win:
  target:
    - target: portable
      arch:
        - x64
  icon: build/icon.png
  executableName: XH-CHAIN
  artifactName: xh-chain-${version}-portable-${arch}.exe
  requestedExecutionLevel: asInvoker
  legalTrademarks: ''

portable:
  artifactName: xh-chain-${version}-portable-${arch}.exe
