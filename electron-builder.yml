# electron-builder 打包配置（文档：https://www.electron.build/configuration）
#
# 打包命令（无需把 electron / electron-builder 装进项目依赖）：
#   npx --yes electron-builder@latest --win portable --x64 --config electron-builder.yml -c.electronVersion=<版本>
# 本地 Windows 一键打包见根目录 pack-win.bat；云端打包见 .github/workflows/package-windows.yml
#
# 产物：release-retry-xxxxx/视频清晰度增强系统-V<version>-便携版.exe
#   免安装单文件，双击即可运行（首次启动会自解压到临时目录，通常 1~3 秒）

appId: com.vidclear.studio
productName: 视频清晰度增强系统
copyright: Copyright © 2026 VidClear Studio. All rights reserved.

directories:
  # 桌面端壳工程目录（独立 package.json + main.cjs），与 Web 工程依赖完全隔离，
  # Web 端 package.json 中不出现任何 Electron 相关依赖
  app: desktop
  output: release
  buildResources: build

asar: true
compression: maximum
npmRebuild: false

# 前端已由 Vite 构建为纯静态资源，作为额外资源放进 resources/renderer，
# 由 desktop/main.cjs 通过本地 http 服务提供给渲染进程。
extraResources:
  - from: dist
    to: renderer
    filter:
      - '**/*'

win:
  # 应用图标：独立设计稿生成（scripts/gen-icon.py），非 Electron 默认图标
  icon: build/icon.ico
  # 可执行文件主体名使用 ASCII，避免个别安全软件/老旧环境下中文路径带来的问题
  executableName: VidClearStudio
  legalTrademarks: 视频清晰度增强系统
  target:
    - target: portable
      arch: [x64]

portable:
  requestExecutionLevel: user
  artifactName: ${productName}-V${version}-便携版.${ext}
