# electron-builder 打包配置（文档：https://www.electron.build/configuration）
# 产物：release/视频设备云数据服务系统-V<version>-便携版.exe
#   免安装单文件，双击即可运行（首次启动会自解压到临时目录，通常 1~3 秒）
appId: com.yunshi.videocloud.dataservice
productName: 视频设备云数据服务系统
copyright: Copyright © 2026 云视科技有限公司. All rights reserved.

directories:
  output: release
  buildResources: build

# 前端依赖已全部由 Vite 打进 dist/，无需携带 node_modules
files:
  - dist/**/*
  - electron/**/*
  - package.json
  - '!node_modules/**/*'

asar: true
compression: maximum
npmRebuild: false

win:
  icon: build/icon.ico
  # 可执行文件主体名使用 ASCII，避免个别安全软件/老旧环境下中文路径带来的问题
  executableName: VideoDeviceCloud
  # 文件属性中的「法律商标」字段
  legalTrademarks: 视频设备云数据服务系统
  target:
    - target: portable
      arch: [x64]

portable:
  requestExecutionLevel: user
  artifactName: ${productName}-V${version}-便携版.${ext}
