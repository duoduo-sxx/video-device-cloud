<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="星火链证 XH-CHAIN">
  <defs>
    <linearGradient id="plate" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0" stop-color="#101E38"/>
      <stop offset="0.55" stop-color="#0A1223"/>
      <stop offset="1" stop-color="#05080F"/>
    </linearGradient>

    <linearGradient id="ringA" x1="0.05" y1="0.15" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#7FB0FF"/>
      <stop offset="0.45" stop-color="#3D7DFF"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>

    <linearGradient id="ringB" x1="0.1" y1="0.9" x2="0.95" y2="0.1">
      <stop offset="0" stop-color="#1D5FD6"/>
      <stop offset="0.55" stop-color="#3D7DFF"/>
      <stop offset="1" stop-color="#58E7F5"/>
    </linearGradient>

    <radialGradient id="aura" cx="0.5" cy="0.42" r="0.58">
      <stop offset="0" stop-color="#3D7DFF" stop-opacity="0.42"/>
      <stop offset="0.62" stop-color="#1B4FBF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#0A1223" stop-opacity="0"/>
    </radialGradient>

    <mask id="interlock">
      <rect width="512" height="512" fill="#fff"/>
      <circle cx="200" cy="256" r="92" fill="none" stroke="#000" stroke-width="36"/>
    </mask>
  </defs>

  <!-- 底板 -->
  <rect width="512" height="512" rx="116" fill="url(#plate)"/>
  <rect width="512" height="512" rx="116" fill="url(#aura)"/>
  <rect x="5" y="5" width="502" height="502" rx="112" fill="none" stroke="#3D7DFF" stroke-opacity="0.28" stroke-width="2"/>

  <!-- 双环相扣 -->
  <circle cx="312" cy="256" r="92" fill="none" stroke="url(#ringB)" stroke-width="28" mask="url(#interlock)"/>
  <circle cx="200" cy="256" r="92" fill="none" stroke="url(#ringA)" stroke-width="28"/>

  <!-- 链上节点 -->
  <circle cx="312" cy="164" r="13" fill="#22D3EE"/>
  <circle cx="312" cy="164" r="13" fill="none" stroke="#0A1223" stroke-opacity="0.55" stroke-width="3"/>
  <circle cx="200" cy="348" r="13" fill="#7FB0FF"/>
  <circle cx="200" cy="348" r="13" fill="none" stroke="#0A1223" stroke-opacity="0.55" stroke-width="3"/>

  <!-- 环内高光 -->
  <circle cx="200" cy="256" r="62" fill="none" stroke="#22D3EE" stroke-opacity="0.16" stroke-width="2"/>
  <circle cx="312" cy="256" r="62" fill="none" stroke="#7FB0FF" stroke-opacity="0.12" stroke-width="2"/>
</svg>
