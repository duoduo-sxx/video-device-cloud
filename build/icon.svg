<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#111c2e"/>
      <stop offset="0.5" stop-color="#0a111d"/>
      <stop offset="1" stop-color="#05080f"/>
    </linearGradient>
    <linearGradient id="gCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8bf5e8"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0e8fb0"/>
    </linearGradient>
    <linearGradient id="gViolet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b49bff"/>
      <stop offset="1" stop-color="#6d4bff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.40"/>
      <stop offset="0.55" stop-color="#22d3ee" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="0.38" cy="0.30" r="0.8">
      <stop offset="0" stop-color="#f0ffff"/>
      <stop offset="0.42" stop-color="#63ecdc"/>
      <stop offset="1" stop-color="#11a7c4"/>
    </radialGradient>
    <clipPath id="rounded">
      <rect x="0" y="0" width="1024" height="1024" rx="228" ry="228"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="1024" height="1024" fill="url(#bg)"/>

    <!-- 背景网格 -->
    <g stroke="#22d3ee" stroke-opacity="0.07" stroke-width="2">
      <path d="M0 256h1024M0 512h1024M0 768h1024M256 0v1024M512 0v1024M768 0v1024"/>
    </g>

    <circle cx="512" cy="512" r="440" fill="url(#glow)"/>

    <!-- 外弧：三等分，每段 96°，间隔 24°，绕中心对称 -->
    <g fill="none" stroke="url(#gCyan)" stroke-linecap="round" stroke-width="24">
      <path d="M229.6 257.7A380 380 0 0 1 794.4 257.7"/>
      <path d="M666.5 164.9A380 380 0 0 1 841.1 702" stroke-opacity="0.55"/>
      <path d="M735.4 819.4A380 380 0 0 1 182.9 702" stroke-opacity="0.30"/>
    </g>

    <!-- 中弧：两段 80°，紫色 -->
    <g fill="none" stroke="url(#gViolet)" stroke-linecap="round" stroke-width="20" stroke-opacity="0.85">
      <path d="M597.5 277.1A250 250 0 0 1 758.2 555.4"/>
      <path d="M426.5 746.9A250 250 0 0 1 265.8 468.6" stroke-opacity="0.5"/>
    </g>

    <!-- 内环 -->
    <circle cx="512" cy="512" r="150" fill="none" stroke="url(#gCyan)" stroke-opacity="0.8" stroke-width="16"/>

    <!-- 核心 -->
    <circle cx="512" cy="512" r="104" fill="#081019" stroke="url(#gCyan)" stroke-width="10" stroke-opacity="0.85"/>
    <circle cx="512" cy="512" r="60" fill="url(#core)"/>
    <circle cx="512" cy="512" r="19" fill="#ffffff" fill-opacity="0.9"/>

    <!-- 卫星节点：顶部为主，两侧为辅 -->
    <circle cx="512" cy="132" r="34" fill="#22d3ee"/>
    <circle cx="512" cy="132" r="54" fill="none" stroke="#22d3ee" stroke-opacity="0.30" stroke-width="8"/>
    <circle cx="841" cy="702" r="26" fill="#8b6bff"/>
    <circle cx="183" cy="702" r="26" fill="#22d3ee" fill-opacity="0.7"/>
  </g>

  <path d="M0 228A228 228 0 0 1 228 0h568a228 228 0 0 1 228 228v52c-260 38-764 38-1024 0z" fill="#ffffff" fill-opacity="0.035"/>
</svg>
