<svg width="512" height="512" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131C2E"/>
      <stop offset="0.55" stop-color="#0A0C10"/>
      <stop offset="1" stop-color="#070A12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#3D7DFF" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#3D7DFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leftPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6AA5FF"/>
      <stop offset="1" stop-color="#2E63E6"/>
    </linearGradient>
    <linearGradient id="rightPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DEFFB"/>
      <stop offset="1" stop-color="#14A9C4"/>
    </linearGradient>
  </defs>

  <!-- 底板：深色圆角方形 -->
  <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#bg)"/>
  <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#glow)"/>
  <rect x="1.5" y="1.5" width="253" height="253" rx="54.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="3"/>

  <!-- 左后景块（景深投影） -->
  <rect x="46" y="102" width="88" height="88" rx="20" fill="#3D7DFF" fill-opacity="0.18"/>

  <!-- 左眼视图（蓝） -->
  <rect x="36" y="90" width="86" height="86" rx="19" fill="url(#leftPanel)"/>
  <rect x="52" y="146" width="54" height="9" rx="4.5" fill="#FFFFFF" fill-opacity="0.85"/>
  <rect x="52" y="104" width="30" height="9" rx="4.5" fill="#0A0C10" fill-opacity="0.30"/>

  <!-- 右眼视图（青，错位体现视差） -->
  <rect x="136" y="66" width="86" height="86" rx="19" fill="url(#rightPanel)"/>
  <rect x="152" y="122" width="54" height="9" rx="4.5" fill="#FFFFFF" fill-opacity="0.85"/>
  <rect x="152" y="80" width="30" height="9" rx="4.5" fill="#0A0C10" fill-opacity="0.30"/>

  <!-- 视差点（两视图之间的收敛点） -->
  <circle cx="128" cy="120" r="7" fill="#FFFFFF"/>
  <circle cx="128" cy="120" r="12" fill="#FFFFFF" fill-opacity="0.22"/>
</svg>
