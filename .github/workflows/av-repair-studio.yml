name: 音视频自动化修补系统

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'av-repair-studio/**'
    paths-ignore:
      - '**.md'

permissions:
  contents: read

jobs:
  build-windows-portable:
    name: Windows 便携版打包
    runs-on: windows-latest
    timeout-minutes: 45

    env:
      # Electron / electron-builder 二进制国内镜像
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      NPM_CONFIG_ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
      # 无签名证书时跳过代码签名
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 前端构建（类型检查 + Vite）
        run: npm run build

      - name: 解析 Electron 版本
        id: electron
        shell: pwsh
        run: |
          $version = (npm view electron version).Trim()
          Write-Host "electronVersion = $version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: 打包 Windows 便携版
        shell: pwsh
        run: >
          npx --yes electron-builder@latest --win portable --x64
          --config electron-builder.yml
          -c.electronVersion=${{ steps.electron.outputs.version }}
          -c.directories.output=release

      - name: 校验产物
        shell: pwsh
        run: |
          Get-ChildItem release -Filter *.exe | ForEach-Object { Write-Host $_.FullName ($_.Length / 1MB).ToString('0.0') + ' MB' }
          if (-not (Get-ChildItem release -Filter *.exe)) { throw '未找到打包产物' }

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: AV-Repair-Studio-portable-x64
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
