name: SpaceScape

on:
  workflow_dispatch:
    inputs:
      electron_version:
        description: 'Electron 版本（留空自动取 npm latest）'
        required: false
        default: ''
  push:
    branches:
      - spacescape-console
    paths:
      - 'src/**'
      - 'electron/**'
      - 'build/**'
      - 'electron-builder.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/spacescape.yml'

jobs:
  build-windows-portable:
    name: Windows 便携版打包
    runs-on: windows-latest
    timeout-minutes: 40

    # 需要写权限：打包结束后把运行日志回写到 .ci/last-run.log（GITHUB_TOKEN 触发的 push 不会再触发 workflow）
    permissions:
      contents: write

    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      NPM_CONFIG_ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm install --no-audit --no-fund
        shell: pwsh

      - name: 构建前端产物
        run: npm run build
        shell: pwsh

      - name: 解析 Electron 版本
        id: electron
        shell: pwsh
        run: |
          $manual = "${{ github.event.inputs.electron_version }}".Trim()
          if ($manual) {
            $v = $manual
          } else {
            $v = (npm view electron version).ToString().Trim()
          }
          Write-Host "ELECTRON_VERSION = $v"
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "ELECTRON_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: electron-builder 打包（win portable x64）
        id: pack
        shell: pwsh
        env:
          PACK_OUTPUT: release-${{ github.run_number }}
        run: |
          npx --yes electron-builder@latest --win portable --x64 `
            --config electron-builder.yml `
            -c.electronVersion=$env:ELECTRON_VERSION `
            -c.publish=never `
            -c.directories.output=$env:PACK_OUTPUT 2>&1 | Tee-Object -FilePath ci-build.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # 把失败日志尾部转成 check annotation，便于通过 API / 仓库页面直接定位
            $tail = if (Test-Path ci-build.log) { Get-Content ci-build.log -Tail 80 | Out-String } else { 'no log captured' }
            $esc = $tail -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A'
            Write-Output "::error title=electron-builder-failed-$code::$esc"
          }
          exit $code

      - name: 列出产物
        if: success()
        shell: pwsh
        run: Get-ChildItem -Path "release-${{ github.run_number }}" -Recurse | Select-Object FullName, Length | Out-String | Tee-Object -FilePath ci-build.log -Append

      - name: 回写打包日志到分支（远端可读，触发不打扰）
        if: always()
        shell: pwsh
        run: |
          git config user.name "ci-log-bot"
          git config user.email "ci-log-bot@users.noreply.github.com"
          New-Item -ItemType Directory -Force -Path .ci | Out-Null
          $tail = if (Test-Path ci-build.log) { Get-Content ci-build.log -Tail 500 | Out-String } else { "no build log captured" }
          $header = "run: #${{ github.run_number }} (id ${{ github.run_id }})`nelectron: $env:ELECTRON_VERSION`nresult: ${{ job.status }}`ntime: $(Get-Date -Format o)`n`n"
          Set-Content -Path .ci/last-run.log -Value ($header + $tail) -Encoding utf8
          git add .ci/last-run.log
          git commit -m "ci: 记录 SpaceScape 打包运行 #${{ github.run_number }} [skip ci]"
          if ($LASTEXITCODE -ne 0) { Write-Output "commit skipped (nothing changed)" }
          git pull --rebase origin spacescape-console 2>&1 | Out-String | Write-Output
          $pushOut = git push origin spacescape-console 2>&1 | Out-String
          Write-Output $pushOut
          if ($LASTEXITCODE -ne 0) {
            $esc = $pushOut -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A'
            Write-Output "::error title=ci-log-push-failed::$esc"
          }

      - name: 上传便携版产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SpaceScape-portable-x64
          path: release-${{ github.run_number }}/*.exe
          if-no-files-found: error
          retention-days: 14
