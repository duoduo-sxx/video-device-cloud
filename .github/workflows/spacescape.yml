name: SpaceScape

on:
  workflow_dispatch:
    inputs:
      electron_version:
        description: 'Electron 版本（留空自动取 npm latest）'
        required: false
        default: ''
  push:
    branches:
      - spacescape-console
    paths:
      - 'src/**'
      - 'electron/**'
      - 'build/**'
      - 'electron-builder.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/spacescape.yml'

jobs:
  build-windows-portable:
    name: Windows 便携版打包
    runs-on: windows-latest
    timeout-minutes: 40

    # 需要写权限：打包结束后把运行日志回写到 .ci/last-run.log（GITHUB_TOKEN 触发的 push 不会再触发 workflow）
    permissions:
      contents: write

    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      NPM_CONFIG_ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # 打包命令与本地 cmd 打包命令保持一致（run 块写入临时 .cmd 文件执行，for 变量需转义为 %%i）
      - name: 打包（Windows 便携版，cmd）
        id: pack
        shell: cmd
        env:
          EB_VERSION: 25.1.8
          INPUT_ELECTRON_VERSION: ${{ github.event.inputs.electron_version }}
        run: |
          call :main > ci-build.log 2>&1
          exit /b %ERRORLEVEL%

          :main
          echo ====== SpaceScape Windows portable build ======
          echo electron-builder=%EB_VERSION% run=#%GITHUB_RUN_NUMBER%
          echo.

          npm install
          npm run build

          for /f "delims=" %%i in ('npm view electron version') do set "ELECTRON_VERSION=%%i"
          if not "%INPUT_ELECTRON_VERSION%"=="" set "ELECTRON_VERSION=%INPUT_ELECTRON_VERSION%"
          echo ELECTRON_VERSION=%ELECTRON_VERSION%

          set "PACK_OUTPUT=release-retry-%RANDOM%"
          echo PACK_OUTPUT=%PACK_OUTPUT%
          npx --yes electron-builder@%EB_VERSION% --win portable --x64 --config electron-builder.yml -c.electronVersion=%ELECTRON_VERSION% -c.directories.output=%PACK_OUTPUT%

          set "EC=%ERRORLEVEL%"
          echo ====== artifacts ======
          dir /s /b "%PACK_OUTPUT%"
          echo ====== exit code %EC% ======
          exit /b %EC%

      - name: 失败时把日志尾部转成 annotation
        if: failure()
        shell: pwsh
        run: |
          $tail = if (Test-Path ci-build.log) { Get-Content ci-build.log -Tail 80 | Out-String } else { 'no log captured' }
          $esc = $tail -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A'
          Write-Output "::error title=SpaceScape-build-failed::$esc"

      - name: 回写打包日志到分支（远端可读，触发不打扰）
        if: always()
        shell: pwsh
        run: |
          git config user.name "ci-log-bot"
          git config user.email "ci-log-bot@users.noreply.github.com"
          New-Item -ItemType Directory -Force -Path .ci | Out-Null
          $tail = if (Test-Path ci-build.log) { Get-Content ci-build.log -Tail 500 | Out-String } else { "no build log captured" }
          $header = "run: #${{ github.run_number }} (id ${{ github.run_id }})`nresult: ${{ job.status }}`ntime: $(Get-Date -Format o)`n`n"
          Set-Content -Path .ci/last-run.log -Value ($header + $tail) -Encoding utf8
          git add .ci/last-run.log
          git commit -m "ci: 记录 SpaceScape 打包运行 #${{ github.run_number }} [skip ci]"
          if ($LASTEXITCODE -ne 0) { Write-Output "commit skipped (nothing changed)"; exit 0 }
          git pull --rebase origin spacescape-console 2>&1 | Out-String | Write-Output
          $pushOut = git push origin spacescape-console 2>&1 | Out-String
          Write-Output $pushOut
          if ($LASTEXITCODE -ne 0) {
            $esc = $pushOut -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A'
            Write-Output "::error title=ci-log-push-failed::$esc"
            exit 1
          }

      - name: 上传便携版产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SpaceScape-portable-x64
          path: release-retry-*/**/*.exe
          if-no-files-found: error
          retention-days: 14
