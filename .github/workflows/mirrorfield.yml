name: 镜域 MirrorField · 三维复刻与 MR 虚实交互系统

# 手动触发，或打 v* 标签时自动打包
on:
  workflow_dispatch:
    inputs:
      electron_version:
        description: 'Electron 版本（留空自动取 npm 最新版）'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: mirrorfield-${{ github.ref }}
  cancel-in-progress: true

env:
  # portable 目标底层是 NSIS，必须下载 nsis / winCodeSign 二进制；
  # 直连 GitHub Releases 在 CI 上常被限流导致打包步骤 exit 1，因此两者都走镜像。
  ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
  NPM_CONFIG_ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
  ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
  # 纯前端产物，不做代码签名
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  build-windows-portable:
    name: Windows 便携版（x64 / portable）
    runs-on: windows-latest
    timeout-minutes: 40

    defaults:
      run:
        working-directory: mirrorfield

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 构建前端
        run: npm run build

      - name: 校验构建产物
        shell: cmd
        run: |
          if not exist "dist\index.html" (
            echo [ERROR] dist\index.html missing
            exit /b 1
          )
          echo dist build OK

      - name: 解析 Electron 版本
        id: electron
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.electron_version }}" ]; then
            VER="${{ github.event.inputs.electron_version }}"
          else
            VER="$(npm view electron version)"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Electron version: $VER"

      - name: 打包 Windows 便携版
        shell: cmd
        run: |
          echo Electron version: ${{ steps.electron.outputs.version }}
          npx --yes electron-builder@latest --win portable --x64 --config electron-builder.yml -c.electronVersion=${{ steps.electron.outputs.version }} -c.directories.output=release-ci > pack.log 2>&1
          set "RC=%ERRORLEVEL%"
          type pack.log
          type pack.log >> "%GITHUB_STEP_SUMMARY%"
          if not "%RC%"=="0" (
            echo [ERROR] electron-builder failed with exit code %RC%
            exit /b %RC%
          )

      - name: 校验产物
        shell: cmd
        run: |
          dir release-ci
          if not exist "release-ci\*.exe" (
            echo [ERROR] no exe produced
            exit /b 1
          )

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: MirrorField-portable-x64
          path: mirrorfield/release-ci/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: 上传打包日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MirrorField-pack-log
          path: mirrorfield/pack.log
          if-no-files-found: ignore
          retention-days: 7
