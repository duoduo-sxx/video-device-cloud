name: 数据云端协同优化传输平台

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-portable:
    name: 打包 Windows Portable (x64)
    runs-on: windows-latest
    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      NPM_CONFIG_ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 构建前端
        run: npm run build

      - name: 读取最新 Electron 版本
        id: electron
        shell: pwsh
        run: |
          $version = (npm view electron version).ToString().Trim()
          Write-Host "Electron version: $version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: electron-builder 打包
        shell: pwsh
        env:
          ELECTRON_VERSION: ${{ steps.electron.outputs.version }}
        run: |
          $outDir = "release-$([System.Guid]::NewGuid().ToString('N').Substring(0,8))"
          $cfg = Join-Path $PWD "electron-builder.ci.yml"
          # 注意：不能用 -c.directories.output=xxx 这种短别名覆盖。
          # PowerShell 会把 "-c" 当成 --config 并把剩余部分当作配置文件路径，
          # 报 ENOENT: open '.directories.output=release-xxxx'。
          # 改为生成一份 extends 基础配置的临时配置，跨 shell 都安全。
          $lines = @(
            "extends: ./electron-builder.yml",
            "electronVersion: $env:ELECTRON_VERSION",
            "directories:",
            "  output: $outDir",
            "  buildResources: build"
          )
          [System.IO.File]::WriteAllLines($cfg, $lines, (New-Object System.Text.UTF8Encoding($false)))
          Get-Content $cfg | ForEach-Object { Write-Host $_ }

          $logPath = Join-Path $PWD "electron-builder.log"
          npx --yes electron-builder@latest --win portable --x64 --config $cfg 2>&1 | Tee-Object -FilePath $logPath
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $tail = (Get-Content $logPath -Tail 30) -join ' | '
            $tail = $tail -replace '%', '%25' -replace "`r", '' -replace "`n", ' '
            Write-Host "::error title=electron-builder 打包失败::$tail"
            exit $code
          }
          Write-Host "=== 输出目录内容 ==="
          Get-ChildItem -Recurse $outDir | ForEach-Object { $_.FullName }
          if (-not (Get-ChildItem "$outDir" -Filter *.exe -ErrorAction SilentlyContinue)) {
            Write-Host "::error title=未生成 exe::打包完成但 $outDir 下没有 exe 文件"
            exit 1
          }

      - name: 保存打包日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electron-builder-log
          path: electron-builder.log
          if-no-files-found: ignore
          retention-days: 7

      - name: 上传打包产物
        uses: actions/upload-artifact@v4
        with:
          name: CloudFlow-Windows-Portable-x64
          # 用通配符匹配，避免依赖 GITHUB_ENV 传递（Windows PowerShell 的
          # Out-File -Encoding utf8 会写 BOM，污染变量名）
          path: release-*/**/*.exe
          if-no-files-found: error
          retention-days: 14
