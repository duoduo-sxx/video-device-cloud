name: 星火链证 XH-CHAIN

on:
  # 手动触发：可在 Actions 页面填写 Electron 版本（留空自动取 npm 最新稳定版）
  workflow_dispatch:
    inputs:
      electron_version:
        description: 'Electron 版本（留空 = 自动取最新稳定版）'
        required: false
        default: ''
  # 打项目专属标签时自动打包（用前缀避免与同仓库其他项目的 v* 标签互相误触发）
  push:
    tags:
      - 'xh-chain-v*'

jobs:
  build-windows-portable:
    name: Windows 便携版打包
    runs-on: windows-latest
    env:
      # 跳过代码签名（未配置证书时避免报错）
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Electron 运行时与 electron-builder 二进制均走镜像，避免下载超时
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 类型检查与前端构建
        run: npm run build

      - name: 解析 Electron 版本
        id: electron
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.electron_version }}"
          if ([string]::IsNullOrWhiteSpace($v)) {
            $v = ((npm view electron version) -join '').Trim()
          }
          if ([string]::IsNullOrWhiteSpace($v)) {
            throw '无法解析 Electron 版本'
          }
          Write-Host "使用 Electron 版本: [$v]"
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: 打包 Windows 便携版
        id: pack
        shell: pwsh
        run: |
          $v = "${{ steps.electron.outputs.version }}"
          Write-Host "electronVersion = [$v]"
          npx --yes electron-builder@latest --win portable --x64 `
            --config electron-builder.yml --publish never `
            "-c.electronVersion=$v" `
            "-c.directories.output=release" 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 输出失败日志到 Summary
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path build.log) {
            $tail = Get-Content build.log -Tail 120 -Raw
          } else {
            $tail = '(build.log 未生成，打包步骤可能在启动前即失败)'
          }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '### 打包失败日志（尾部 120 行）'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $tail
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'

      - name: 上传打包产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xh-chain-windows-portable
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
