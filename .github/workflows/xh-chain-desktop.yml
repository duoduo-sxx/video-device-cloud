name: 星火链证 XH-CHAIN

on:
  # 手动触发：可在 Actions 页面填写 Electron 版本（留空自动取 npm 最新稳定版）
  workflow_dispatch:
    inputs:
      electron_version:
        description: 'Electron 版本（留空 = 自动取最新稳定版）'
        required: false
        default: ''
  # 打 v* 标签时自动打包
  push:
    tags:
      - 'v*'

jobs:
  build-windows-portable:
    name: Windows 便携版打包
    runs-on: windows-latest
    env:
      # 跳过代码签名（未配置证书时避免报错）
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 类型检查与前端构建
        run: npm run build

      - name: 解析 Electron 版本
        id: electron
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.electron_version }}"
          if ([string]::IsNullOrWhiteSpace($v)) {
            $v = ((npm view electron version) -join '').Trim()
          }
          Write-Host "使用 Electron 版本: $v"
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: 打包 Windows 便携版
        shell: pwsh
        run: >
          npx --yes electron-builder@latest --win portable --x64
          --config electron-builder.yml --publish never
          -c.electronVersion=${{ steps.electron.outputs.version }}
          -c.directories.output=release

      - name: 上传打包产物
        uses: actions/upload-artifact@v4
        with:
          name: xh-chain-windows-portable
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
