# GitHub Actions：云端打包 Windows 桌面应用（单个免安装 exe）
#
# 触发方式（二选一）：
#   1. 手动：仓库 Actions 页 → Build Windows EXE → Run workflow
#   2. 自动：推送 v 开头的标签（如 git tag v1.0.0 && git push origin v1.0.0），
#      构建完成后自动创建 GitHub Release 并附上 exe
#
# 产物：video-device-cloud 便携版单文件 exe
#   release/视频设备云数据服务系统-V<版本>-便携版.exe
#   双击即可运行，无需安装；文件属性中的「文件说明 / 产品名称 / 公司名称 / 版本」均来自 package.json 与 electron-builder.yml

name: Build Windows EXE

on:
  workflow_dispatch: {} # 手动触发
  push:
    branches: [main] # 推送到 main 自动构建（产物在 Actions 的 Artifacts 里下载）
    tags:
      - 'v*' # 打 tag 时额外创建 Release 并附上 exe

permissions:
  contents: write # 打 tag 时创建 Release 需要

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-win:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8 # 与仓库 pnpm-lock.yaml（lockfileVersion 6.0）保持一致

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # 缓存 Electron / electron-builder 二进制，二次构建提速约 3-5 分钟
      - name: 缓存 Electron 二进制
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-win-${{ hashFiles('package.json') }}
          restore-keys: electron-win-

      - name: 安装依赖
        # --no-frozen-lockfile：允许 lockfile 与 package.json 有差异时自动补齐
        run: pnpm install --no-frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      - name: 构建前端产物
        run: pnpm build

      - name: 打包 Windows 便携版单文件 exe
        run: pnpm exec electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 列出产物
        shell: pwsh
        run: Get-ChildItem release -Filter *.exe | Select-Object Name, @{n='SizeMB';e={[math]::Round($_.Length/1MB,1)}}

      # 关键校验：确认前端产物确实被打进应用包，避免出现"双击无反应"（界面资源缺失导致加载失败）
      - name: 校验包内前端资源
        shell: pwsh
        run: |
          $asar = "release/win-unpacked/resources/app.asar"
          if (-not (Test-Path $asar)) { Write-Error "未找到 $asar，打包结构异常"; exit 1 }
          node -e "const fs=require('fs');const s=fs.readFileSync(process.argv[1]).toString('latin1');const need=['index.html','electron','main.js'];const miss=need.filter(k=>!s.includes(k));console.log(miss.length?('缺少: '+miss.join(',')):'校验通过：app.asar 已包含前端页面与 Electron 主进程');process.exit(miss.length?1:0)" "$asar"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: video-device-cloud-windows-exe
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: 发布 Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
