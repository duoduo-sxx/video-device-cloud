# GitHub Actions：云端打包 Windows 桌面应用（.exe）
#
# 触发方式（二选一）：
#   1. 手动：仓库 Actions 页 → Build Windows EXE → Run workflow
#   2. 自动：推送 v 开头的标签（如 git tag v1.0.0 && git push origin v1.0.0），
#      构建完成后自动创建 GitHub Release 并附上 exe
#
# 产物（Actions Artifacts 或 Release 附件）：
#   - video-device-cloud-<版本>-x64-Setup.exe     NSIS 安装包（中文界面、桌面/开始菜单快捷方式、可卸载）
#   - video-device-cloud-<版本>-x64-Portable.exe  免安装便携版（单文件，双击即用）

name: Build Windows EXE

on:
  workflow_dispatch: {} # 手动触发
  push:
    tags:
      - 'v*' # 打 tag 时自动构建并发布 Release

permissions:
  contents: write # 打 tag 时创建 Release 需要

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-win:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # 缓存 Electron / electron-builder 二进制，二次构建提速约 3-5 分钟
      - name: 缓存 Electron 二进制
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-win-${{ hashFiles('package.json') }}
          restore-keys: electron-win-

      - name: 安装依赖
        # --no-frozen-lockfile：允许 lockfile 与 package.json 有差异时自动补齐
        run: pnpm install --no-frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      - name: 构建前端产物
        run: pnpm build

      - name: 打包 Windows（便携版 + 安装包）
        run: pnpm exec electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: 发布 Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
