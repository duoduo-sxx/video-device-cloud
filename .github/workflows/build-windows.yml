# GitHub Actions：云端打包 Windows 桌面应用（单个免安装 exe）
#
# 打包形式与本地脚本 pack-win.bat 完全一致：
#   - electron / electron-builder 不写进项目依赖，打包时通过 npx 按需拉取
#   - 桌面端代码独立放在 desktop/ 目录（package.json + main.cjs）
#   - 前端产物 dist/ 作为额外资源打进 resources/renderer
#
# 触发方式（三选一）：
#   1. 手动：仓库 Actions 页 → Build Windows EXE → Run workflow
#   2. 自动：推送到 nexusplay-console 分支（产物在 Actions 的 Artifacts 里下载）
#   3. 自动：推送 v 开头的标签（如 git tag v1.0.0 && git push origin v1.0.0），
#      构建完成后自动创建 GitHub Release 并附上 exe
#
# 产物：release/NexusPlay 游戏开发管理平台-V<version>-便携版.exe
#   双击即可运行，无需安装；文件属性中的「文件说明 / 产品名称 / 公司名称 / 版本」
#   来自 desktop/package.json 与 electron-builder.yml

name: Build Windows EXE

on:
  workflow_dispatch: {} # 手动触发
  push:
    branches: [nexusplay-console]
    tags:
      - 'v*'

permissions:
  contents: write # 打 tag 时创建 Release 需要

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-win:
    runs-on: windows-latest
    timeout-minutes: 40

    env:
      # 从 npmmirror 拉取 Electron 运行时与 electron-builder 的二进制依赖
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      NPM_CONFIG_ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 缓存 Electron / electron-builder 下载的二进制，二次构建提速约 3-5 分钟
      - name: 缓存 Electron 二进制
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
            ~\AppData\Local\npm-cache\_npx
          key: electron-win-${{ hashFiles('desktop/package.json', 'electron-builder.yml', 'package.json') }}
          restore-keys: electron-win-

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 构建前端产物
        run: npm run build

      - name: 解析 Electron 版本
        id: electron_version
        shell: pwsh
        run: |
          $version = (npm view electron version | Out-String).Trim()
          if (-not $version) { Write-Error "获取 Electron 版本失败，请检查网络"; exit 1 }
          if ($env:ELECTRON_VERSION) { $version = $env:ELECTRON_VERSION }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Electron 版本: $version"

      - name: 打包 Windows 便携版单文件 exe
        shell: pwsh
        run: |
          $ev = "${{ steps.electron_version.outputs.version }}"
          $builder = @('--yes','electron-builder@latest','--win','portable','--x64','--config','electron-builder.yml',"-c.electronVersion=$ev",'-c.directories.output=release')
          npx @builder 2>&1 | Tee-Object -FilePath build-pack.log
          $code = $LASTEXITCODE

          if ($code -ne 0) {
            $out = "release-retry-$env:GITHUB_RUN_ATTEMPT"
            Write-Host "::warning::首次打包失败（退出码 $code），换输出目录 $out 重试"
            $retry = @('--yes','electron-builder@latest','--win','portable','--x64','--config','electron-builder.yml',"-c.electronVersion=$ev","-c.directories.output=$out")
            npx @retry 2>&1 | Tee-Object -FilePath build-pack-retry.log
            $code = $LASTEXITCODE
          }

          if ($code -ne 0) {
            Write-Host "::error::electron-builder 打包失败，退出码 $code，请查看 build-pack-log 产物"
            exit $code
          }

      - name: 上传打包日志（便于排查失败）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-pack-log
          path: |
            build-pack.log
            build-pack-retry.log
          if-no-files-found: ignore
          retention-days: 7

      - name: 列出产物
        shell: pwsh
        run: |
          Get-ChildItem -Path release*,* -Filter *.exe -Recurse -Depth 1 -ErrorAction SilentlyContinue |
            Select-Object Name, @{n='SizeMB';e={[math]::Round($_.Length/1MB,1)}}

      # 关键校验：确认桌面端主进程与前端页面确实被打进产物，
      # 避免出现"双击闪退 / 双击无反应"（应用包结构或界面资源缺失导致）
      - name: 校验包内结构
        shell: pwsh
        run: |
          $unpacked = Get-ChildItem -Path . -Filter win-unpacked -Directory -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $unpacked) { Write-Error "未找到 win-unpacked 目录，打包结构异常"; exit 1 }
          Write-Host "校验目录：$($unpacked.FullName)"

          $renderer = Join-Path $unpacked.FullName "resources/renderer/index.html"
          if (-not (Test-Path $renderer)) { Write-Error "缺少前端产物：$renderer"; exit 1 }

          $assets = Get-ChildItem (Join-Path $unpacked.FullName "resources/renderer/assets") -Filter *.js -ErrorAction SilentlyContinue
          if (-not $assets) { Write-Error "前端产物 assets 目录为空"; exit 1 }

          $asar = Join-Path $unpacked.FullName "resources/app.asar"
          if (-not (Test-Path $asar)) { Write-Error "未找到 $asar，打包结构异常"; exit 1 }

          node -e "const fs=require('fs');const s=fs.readFileSync(process.argv[1]).toString('latin1');const need=['main.cjs','package.json'];const miss=need.filter(k=>!s.includes(k));console.log(miss.length?('缺少: '+miss.join(',')):'校验通过：app.asar 含桌面端主进程，resources/renderer 含前端页面');process.exit(miss.length?1:0)" "$asar"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: nexusplay-console-windows-exe
          path: |
            release/*.exe
            release-retry-*/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: 发布 Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release-retry-*/*.exe
          generate_release_notes: true
