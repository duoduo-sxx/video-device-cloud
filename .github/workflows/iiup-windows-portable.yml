name: 智能交互与理解软件系统与技术服务

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - feature/iiup-web
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: iiup-portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-portable:
    name: Windows portable x64
    runs-on: windows-latest
    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      NPM_CONFIG_ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
      NPM_CONFIG_FUND: 'false'
      NPM_CONFIG_AUDIT: 'false'

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm install

      - name: 类型检查
        run: npm run typecheck

      - name: 构建前端产物
        run: npm run build

      - name: 缓存 Electron 与打包工具
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LOCALAPPDATA }}\electron\Cache
            ${{ env.LOCALAPPDATA }}\electron-builder\Cache
          key: electron-cache-${{ runner.os }}-v2
          restore-keys: |
            electron-cache-${{ runner.os }}-

      # 打包命令与本地 scripts/pack-win.cmd 完全一致（cmd 语法），
      # 避免 PowerShell 对 -c.xxx=yyy 参数的改写问题
      - name: 打包 Windows 免安装版
        shell: cmd
        run: |
          for /f "delims=" %%i in ('npm view electron version') do set "ELECTRON_VERSION=%%i"
          echo Electron version: %ELECTRON_VERSION%
          set "PACK_OUTPUT=release-retry-%RANDOM%"
          npx --yes electron-builder@latest --win portable --x64 --config electron-builder.yml -c.electronVersion=%ELECTRON_VERSION% -c.directories.output=%PACK_OUTPUT% --publish never

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: IIUP-portable-x64
          path: release-retry-*/IIUP-*-portable-x64.exe
          if-no-files-found: error
          retention-days: 30
