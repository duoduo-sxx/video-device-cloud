name: 智能交互与理解软件系统与技术服务

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - feature/iiup-web
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: iiup-portable-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  windows-portable:
    name: Windows portable x64
    runs-on: windows-latest
    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      NPM_CONFIG_ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
      NPM_CONFIG_FUND: 'false'
      NPM_CONFIG_AUDIT: 'false'

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm install

      - name: 类型检查
        run: npm run typecheck

      - name: 构建前端产物
        run: npm run build

      - name: 解析 Electron 版本
        run: |
          $version = (npm view electron version).Trim()
          if (-not $version) { throw 'Failed to resolve electron version from npm registry' }
          "ELECTRON_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Electron version: $version"

      - name: 缓存 Electron 与打包工具
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LOCALAPPDATA }}\electron\Cache
            ${{ env.LOCALAPPDATA }}\electron-builder\Cache
          key: electron-cache-${{ runner.os }}-${{ env.ELECTRON_VERSION }}
          restore-keys: |
            electron-cache-${{ runner.os }}-

      - name: 打包 Windows 免安装版
        run: |
          if (-not $env:ELECTRON_VERSION) {
            $env:ELECTRON_VERSION = (npm view electron version).Trim()
          }
          $output = "release-retry-${{ github.run_number }}"
          Write-Host "Packaging with electron $env:ELECTRON_VERSION -> $output"
          npx --yes electron-builder@latest --win portable --x64 --config electron-builder.yml -c.electronVersion=$env:ELECTRON_VERSION -c.directories.output=$output

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: IIUP-portable-x64
          path: release-retry-*/IIUP-*-portable-x64.exe
          if-no-files-found: error
          retention-days: 30
